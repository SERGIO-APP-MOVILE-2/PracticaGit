version: '3.8'
services:
  app:
    build: .
    container_name: mini-ecommerce-app
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/mini_ecommerce
    depends_on:
      - db
    volumes:
      - .:/usr/src/app
    command: sh -c "npm install && npx prisma migrate deploy && npm run dev"
  db:
    image: postgres:15
    container_name: mini-ecommerce-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mini_ecommerce
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
